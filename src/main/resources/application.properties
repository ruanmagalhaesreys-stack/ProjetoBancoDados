spring.application.name=ru

# Telas em JSP
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
# Sessão do login guardada só em cookie (sem ;jsessionid na URL)
server.servlet.session.tracking-modes=cookie

# Erros abrem a nossa tela WEB-INF/jsp/error.jsp, e não a página padrão do Spring
server.error.whitelabel.enabled=false

# A conexão com o banco fica na classe br.uel.ru.dao.Conexao
